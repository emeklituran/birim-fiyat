name: Import CSB historical annual books
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download and import official 2025 and 2024 books
        run: python tools/import_csb_history.py
      - name: Validate all data
        run: python -m unittest discover -s tests
      - name: Commit imported history
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/history-2025.json data/history-2024.json data/sources.json
          git commit -m "Import CSB 2025 and 2024 annual unit prices"
          git push
